name: Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Vim
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libncurses-dev
          git clone --depth 1 https://github.com/vim/vim.git "$RUNNER_TEMP/vim"
          cd "$RUNNER_TEMP/vim"
          ./configure --prefix="$HOME/vim" \
              --enable-gui=no --without-x --disable-nls
          make -j"$(nproc)"
          make install
          echo "$HOME/vim/bin" >> "$GITHUB_PATH"

      - name: Run the tests
        run: |
          vim --version | head -1
          cd test && ./run

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # The tests write files and read them back, so they have to come out
      # the way they went in.
      - name: Leave the line endings alone
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      # Building Vim here would want MSVC; these are the same sources,
      # already built, and new enough for the plugin.
      - name: Take the newest Vim built for Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api repos/vim/vim-win32-installer/releases/latest \
                --jq '.assets[]
                      | select(.name | test("^gvim_.*_x64\\.zip$"))
                      | .browser_download_url')
          echo "$url"
          curl -sSLo "$HOME/gvim.zip" "$url"
          unzip -q "$HOME/gvim.zip" -d "$HOME/vim-win"
          # vim-launcher holds a stub that looks for an installed Vim.
          echo "VIMPROG=$(find "$HOME/vim-win" -name vim.exe \
              -not -path '*/vim-launcher/*' | head -n 1)" >> "$GITHUB_ENV"

      - name: Run the tests
        run: |
          "$VIMPROG" --version | head -1
          cd test && ./run
